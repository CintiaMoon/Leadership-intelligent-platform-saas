spring:
  application:
    name: api
  autoconfigure:
    exclude:
      # No default in-memory user/password; real authentication arrives with SPEC-AUTH.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas}
    username: ${DB_USERNAME:saas}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it. Never use update/create in any profile.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    # Shared secrets that authenticate the BFF (ADR-001, D-50): comma-separated, at most two (current and
    # previous during rotation), each at least 43 characters. No default: unset rejects every /api request.
    bff-credentials: ${BFF_CREDENTIALS:}
    # Only these peers may supply X-Forwarded-For. Replace with the BFF/ingress subnets outside local dev.
    trusted-proxy-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32,::1/128}
  rate-limit:
    # Required, no default: HMAC key for hashing rate-limit identifiers (ADR-004, D-86).
    hmac-key: ${RATE_LIMIT_HMAC_KEY:}

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
