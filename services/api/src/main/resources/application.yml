spring:
  application:
    name: api
  autoconfigure:
    exclude:
      # No default in-memory user/password; real authentication arrives with SPEC-AUTH.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saas}
    username: ${DB_USERNAME:saas}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it. Never use update/create in any profile.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
