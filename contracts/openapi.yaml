openapi: 3.1.0
info:
  title: SaaS Platform API
  version: 0.1.0
  description: |
    Contract for the Spring Boot API. Only the SPEC-AUTH (slice 001), SPEC-TEN (slice 002), SPEC-MEM (slice 003) and SPEC-INV (slice 004) operations are defined so far;
    each further endpoint is added with its approved feature spec (docs/api/contract-guidelines.md).

    Conventions
    - Errors use RFC 9457 `application/problem+json` with a stable `code` (ADR-005).
    - The browser reaches this API only through the Next.js BFF, which authenticates to the API with
      the `bffCredential` header (ADR-001, D-50, D-91). The BFF passes the session cookie through.
    - Every state-changing operation requires `X-CSRF-TOKEN` (D-75). Obtain it from `GET /api/v1/auth/csrf`.
    - All `/api/v1/auth/**` responses carry `Cache-Control: no-store` (AC-AUTH-24).
    - Secrets (passwords, verification and reset tokens) travel only in request bodies, never in a
      path or query string (D-44, AC-AUTH-35).
    - A `companyId` in a path only selects a company; access comes from the caller's ACTIVE membership,
      checked on every request (D-03, D-109). A company the caller cannot access, or that does not exist,
      returns 404 `NOT_FOUND`; 403 `FORBIDDEN` means an active member lacks the permission (D-108).
servers:
  - url: http://localhost:8080
    description: Local development only
security:
  - bffCredential: []
tags:
  - name: Authentication
    description: Signup, email verification, login, logout, session, step-up, and password reset (SPEC-AUTH).
  - name: Companies
    description: Company creation and reading (SPEC-TEN).
  - name: Members
    description: Member list, role changes, suspension, removal and leaving (SPEC-MEM).
  - name: Invitations
    description: Inviting people to a company, listing, resending and revoking invitations (SPEC-INV).
paths:
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Get a CSRF token
      description: |
        Before login this returns a stateless signed double-submit token; after login it returns the
        session-bound token. Re-fetch after login, logout, and any session-id rotation.
      responses:
        '200':
          description: CSRF token.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/signup:
    post:
      tags: [Authentication]
      operationId: signup
      summary: Register an account
      description: |
        Always returns the same 202 response whether or not the normalized email already exists
        (AC-AUTH-02). A new account receives a verification email; an existing account receives an
        attempted-registration email. An account whose email was never verified is taken over by the
        newest signup: its password and display name are replaced, its earlier verification links stop
        working, and a new verification email is sent (D-97, AC-AUTH-41). The verification email carries
        no display name. Limits: 5 per IP per hour, and 3 per normalized email per 24 hours; the
        per-email limit is silent and returns the same 202 (D-101).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '202':
          $ref: '#/components/responses/Neutral'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/verify-email:
    post:
      tags: [Authentication]
      operationId: verifyEmail
      summary: Verify an email address with a single-use token
      description: Unknown, expired, and already-consumed tokens return the same `TOKEN_INVALID` problem (AC-AUTH-37).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          $ref: '#/components/responses/TokenInvalid'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/verify-email/resend:
    post:
      tags: [Authentication]
      operationId: resendVerificationEmail
      summary: Request a new verification email
      description: |
        Always returns the same neutral 202 whether or not an unverified account exists (AC-AUTH-20),
        including when throttled per account. Limits: 3 per account and 10 per IP per hour.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Neutral'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Log in with email and password
      description: |
        Establishes a server-side session and rotates the session identifier. The session cookie is
        set by this response and is never present in a body or URL. Unknown account, wrong password,
        unverified email, DISABLED account, and throttled attempts all return the same 401
        `INVALID_CREDENTIALS` problem (AC-AUTH-13, 19, 26, 29). A successful login also sets the signed
        `__Host-device` known-device cookie (HttpOnly, Secure, SameSite=Lax, 90 days), which the client
        sends back on later logins to be exempt from the account-wide failure ceiling (D-99).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
            Set-Cookie:
              description: |
                The `__Host-session` cookie (HttpOnly, Secure, SameSite=Lax, Path=/) and the
                `__Host-device` known-device cookie.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Log out and revoke the session
      description: Revokes the server-side session and clears the cookie.
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Session revoked and cookie cleared.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getSession
      summary: Get the current session
      description: Returns the authenticated user. Never returns the session identifier.
      security:
        - bffCredential: []
          sessionCookie: []
      responses:
        '200':
          description: Current session.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/step-up:
    post:
      tags: [Authentication]
      operationId: stepUp
      summary: Re-enter the password to refresh the last-authentication time
      description: |
        Sets `lastAuthenticatedAt`; only login and this operation do (AC-AUTH-22). Required within
        10 minutes for the sensitive operations in SPEC-AUTH. A wrong password returns 401
        `INVALID_CREDENTIALS` and is counted against the login throttle.
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepUpRequest'
      responses:
        '204':
          description: Recent authentication recorded.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/password-reset/request:
    post:
      tags: [Authentication]
      operationId: requestPasswordReset
      summary: Request a password-reset email
      description: |
        Always returns the same neutral 202 (AC-AUTH-30). Limits: 3 per account and 10 per IP per hour.
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '202':
          $ref: '#/components/responses/Neutral'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/auth/password-reset/confirm:
    post:
      tags: [Authentication]
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: |
        The token travels in the body (it reaches the client in the URL fragment). On success all of
        the user's sessions are revoked and other reset tokens are invalidated (AC-AUTH-32).
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed.
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '422':
          $ref: '#/components/responses/TokenInvalid'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/companies:
    post:
      tags: [Companies]
      operationId: createCompany
      summary: Create a company
      description: |
        Any signed-in user with a verified email and an ACTIVE account can create a company and becomes
        its Owner. The company and the Owner membership are created in one transaction (AC-TEN-01, 02).
        The role is decided by the server; a `role` or any other unknown field in the body is rejected
        (AC-TEN-05). Limits: 5 attempts per IP per hour and 10 per account per day, counted before the
        name is validated (AC-TEN-13, 15); exceeding either returns 429, and an unavailable counter
        store returns 503 (fail closed, ADR-004).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyRequest'
      responses:
        '201':
          description: Company created; the caller is its Owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Companies]
      operationId: listCompanies
      summary: List the caller's companies
      description: |
        The companies in which the caller has an ACTIVE membership, with the caller's role in each.
        A company that is PENDING_DELETION is listed only for its Owner (AC-DEL-14).
      security:
        - bffCredential: []
          sessionCookie: []
      responses:
        '200':
          description: The caller's companies.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/companies/{companyId}:
    get:
      tags: [Companies]
      operationId: getCompany
      summary: Get a company
      description: Requires the "View company details" permission (SPEC-TEN matrix).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The company, with the caller's role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetails'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/members:
    get:
      tags: [Members]
      operationId: listMembers
      summary: List the company's members
      description: |
        Requires the "View member list" permission (Owner and Admin). Lists ACTIVE and SUSPENDED members (removed
        members stay in the audit trail only), at most 500. A member's email is shown to Owners and Admins (D-132).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The members.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/members/{membershipId}:
    patch:
      tags: [Members]
      operationId: changeMemberRole
      summary: Change a member's role
      description: |
        The new role is ADMIN, AGENT or VIEWER; Owner cannot be assigned here (ownership moves by transfer). The
        target must be ACTIVE and the role must differ. An Owner may change any non-Owner member; an Admin only an
        Agent or a Viewer, to Agent or Viewer. Promoting to Admin or demoting an Admin is Owner-only and needs a login
        or step-up within the last 10 minutes (403 `REAUTHENTICATION_REQUIRED`). Nobody changes their own role. The
        Owner membership is never changed here (409). Changes are serialized per company (D-125).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '200':
          description: The member after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member
      description: |
        Ends the membership (ACTIVE or SUSPENDED to REMOVED); rejoining needs a new invitation. Only an Owner removes
        an Admin; an Admin removes Agents and Viewers. The Owner cannot be removed (409). Access ends on the member's
        next request.
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/companies/{companyId}/members/{membershipId}/suspend:
    post:
      tags: [Members]
      operationId: suspendMember
      summary: Suspend a member
      description: |
        ACTIVE to SUSPENDED. The role is kept. The member is denied all access to the company from the next request. The
        actor and time are recorded (AC-MEM-13).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The member after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/companies/{companyId}/members/{membershipId}/reactivate:
    post:
      tags: [Members]
      operationId: reactivateMember
      summary: Reactivate a suspended member
      description: |
        SUSPENDED to ACTIVE, with the preserved role. Rejected with 409 if the company's plan has no room for another
        active member (AC-MEM-17; enforced once plans exist, slice 006).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: membershipId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The member after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/companies/{companyId}/leave:
    post:
      tags: [Members]
      operationId: leaveCompany
      summary: Leave the company
      description: |
        The caller's own ACTIVE membership becomes REMOVED. Admins, Agents and Viewers may leave; the Owner may not
        (403: transfer ownership first). The user account is not deleted and other companies are unaffected. The
        session identifier is rotated (AC-AUTH-23): the response sets a new session cookie and the old one stops
        working.
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Left the company.
          headers:
            Set-Cookie:
              description: The rotated `__Host-session` cookie.
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/companies/{companyId}/invitations:
    post:
      tags: [Invitations]
      operationId: createInvitation
      summary: Invite someone to the company
      description: |
        Requires the "Invite new members" permission (Owner and Admin). An Owner may invite Admin, Agent or Viewer; an
        Admin only Agent or Viewer; nobody can invite an Owner (a bad request). Inviting an **Admin** needs a login or
        step-up within the last 10 minutes (403 `REAUTHENTICATION_REQUIRED`). The invitation is valid for 7 days; it
        is rejected (409) if the address already belongs to an ACTIVE or SUSPENDED member or already has a pending,
        unexpired invitation (resend it instead). Creating is not limited by the company's remaining plan capacity.
        The invitation email is sent after the request commits; until then `emailSent` is false and the invitation cannot
        be accepted. The response never contains a token. Limits: 20 per inviter per hour, 50 per company per day and
        3 sends per recipient address per 24 hours, resends included, counted before the request is validated; an
        unavailable counter store returns 503 (fail closed).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: The invitation, PENDING.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationSummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Invitations]
      operationId: listInvitations
      summary: List the pending invitations
      description: |
        Requires the "View member list" permission (Owner and Admin). Lists the company's PENDING invitations that have
        not expired, newest first. Revoked, accepted and expired invitations are not listed.
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The pending invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvitationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/companies/{companyId}/invitations/{invitationId}/resend:
    post:
      tags: [Invitations]
      operationId: resendInvitation
      summary: Send an invitation again
      description: |
        Requires the "Revoke or resend invitations" permission, and only for roles the caller may invite (an Admin cannot
        resend an Admin invitation). The earlier token stops working at once, in the same transaction; a new token is
        minted when the new email is delivered, and the 7 days start again. A pending invitation that has run past its
        expiry can be resent. An invitation that is not pending returns 409. Resending an Admin invitation needs a login
        or step-up within the last 10 minutes. Counts toward the send limits (see `createInvitation`).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The invitation after the change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/companies/{companyId}/invitations/{invitationId}:
    delete:
      tags: [Invitations]
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        Requires the "Revoke or resend invitations" permission, and only for roles the caller may invite. Takes effect
        at once: the token stops working in the same transaction. An invitation that is not pending returns 409.
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: companyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /api/v1/invitations/accept:
    post:
      tags: [Invitations]
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Needs a verified session and the session-bound CSRF token. The token from the invitation link is sent **in the
        request body only**: it is never accepted in the path or the query string, and the link carries it in the URL
        fragment, which browsers do not send. There is no company in the request: the company is the one the
        invitation belongs to. The signed-in user's verified address must match the invitation's address.

        Every reason the invitation itself cannot be used returns the same 422 `TOKEN_INVALID`: unknown, expired
        (7 days after it was last issued), revoked, replaced by a resend, already used, the signed-in address does not
        match, the company is pending deletion or gone, or the inviter can no longer grant the role. Only after the
        address matched can the answer differ: 409 `CONFLICT` if the user is already an ACTIVE or SUSPENDED member
        (nothing changes and the invitation stays pending) or the company has no room for another active member. The
        user becomes a member with the invited role, in one transaction with the end of the invitation. Following a link
        never verifies an address.

        Only failed attempts count toward the limit: the 11th failed attempt from one client address within an hour
        returns 429. An unavailable counter store returns 503 (fail closed).
      security:
        - bffCredential: []
          sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: The company that was joined and the role received.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySummary'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CsrfRejected'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/TokenInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    bffCredential:
      type: apiKey
      in: header
      name: X-BFF-Credential
      description: |
        Per-environment shared secret (at least 256 bits) that authenticates the BFF as a client. It does
        not identify the user (D-50, D-91). Requests without it have forwarded headers ignored and are
        rejected.
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-session
      description: Server-side session identifier set by login. HttpOnly, Secure, SameSite=Lax.
  headers:
    NoStore:
      description: Always `no-store` on authentication responses.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
  parameters:
    CsrfHeader:
      name: X-CSRF-TOKEN
      in: header
      required: true
      description: CSRF token from `GET /api/v1/auth/csrf` (D-75).
      schema:
        type: string
        minLength: 1
        maxLength: 512
  schemas:
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
          minLength: 1
          maxLength: 512
    SignupRequest:
      type: object
      required: [email, password, displayName]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          description: Normalized server-side (trim, lowercase, punycode domain); the original text is stored.
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
          description: |
            8 to 128 code points, NFKC-normalized server-side, not on the compromised-password list. The
            server answers `TOO_SHORT`, `TOO_LONG`, or `BREACHED_PASSWORD`.
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed server-side; must not be empty afterwards.
    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    StepUpRequest:
      type: object
      required: [password]
      additionalProperties: false
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    Role:
      type: string
      enum: [OWNER, ADMIN, AGENT, VIEWER]
      description: The caller's role in one company. Decided by the server; never accepted from a request.
    CompanyStatus:
      type: string
      enum: [ACTIVE, PENDING_DELETION]
    CreateCompanyRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 400
          description: |
            1 to 100 Unicode code points after NFKC normalization and trimming. Control, format (bidi overrides,
            zero-width characters), line and paragraph separator, surrogate and private-use characters are
            rejected (D-105, D-122). The wire limit only caps request size. Names are not unique.
    CompanySummary:
      type: object
      required: [id, name, role]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          $ref: '#/components/schemas/Role'
    CompanyDetails:
      type: object
      required: [id, name, status, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: '#/components/schemas/CompanyStatus'
        role:
          $ref: '#/components/schemas/Role'
        createdAt:
          type: string
          format: date-time
    MembershipStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, REMOVED]
    ChangeMemberRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [ADMIN, AGENT, VIEWER]
          description: The new role. Owner cannot be assigned through role editing.
    MemberSummary:
      type: object
      required: [id, displayName, email, role, status, joinedAt, self]
      properties:
        id:
          type: string
          format: uuid
          description: The membership ID, used in the member paths. Not the user ID.
        displayName:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        joinedAt:
          type: string
          format: date-time
        self:
          type: boolean
          description: True for the caller's own membership.
    CreateInvitationRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email:
          type: string
          maxLength: 254
          description: The address to invite. Matched on its normalized form.
        role:
          type: string
          enum: [ADMIN, AGENT, VIEWER]
          description: The role the person receives on accepting. Owner cannot be invited.
    InvitationStatus:
      type: string
      enum: [PENDING, ACCEPTED, REVOKED, EXPIRED]
    InvitationSummary:
      type: object
      required: [id, email, role, status, expiresAt, createdAt, emailSent]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        role:
          type: string
          enum: [ADMIN, AGENT, VIEWER]
        status:
          $ref: '#/components/schemas/InvitationStatus'
        expiresAt:
          type: string
          format: date-time
          description: 7 days after the latest create or resend.
        createdAt:
          type: string
          format: date-time
        emailSent:
          type: boolean
          description: False until the invitation email has been delivered. Never exposes a token.
    AcceptInvitationRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
          description: The raw token from the invitation link. Single use. Never logged.
    SessionInfo:
      type: object
      required: [userId, email, displayName, emailVerified, lastAuthenticatedAt, expiresAt]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        emailVerified:
          type: boolean
        lastAuthenticatedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Absolute session end (12 hours after login).
    NeutralResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Fixed text, identical for every outcome of the operation.
    ErrorCode:
      type: string
      description: |
        Stable application error code (ADR-005). The frontend maps codes to messages. `REAUTHENTICATION_REQUIRED`
        (403) is returned by the sensitive operations (promoting or demoting an Admin now; ownership transfer, company
        deletion and export in later slices) when the session is valid but the last login or
        step-up is older than 10 minutes; call `POST /api/v1/auth/step-up` and retry.
      enum:
        - VALIDATION_FAILED
        - REQUEST_REJECTED
        - INVALID_CREDENTIALS
        - TOKEN_INVALID
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - CSRF_REJECTED
        - REAUTHENTICATION_REQUIRED
        - RATE_LIMITED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
          description: 'Stable field error code. One of REQUIRED, INVALID, INVALID_LENGTH, INVALID_EMAIL, INVALID_NAME, TOO_SHORT, TOO_LONG, BREACHED_PASSWORD.'
    Problem:
      type: object
      description: RFC 9457 problem details with a stable `code`.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          $ref: '#/components/schemas/ErrorCode'
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    Neutral:
      description: Accepted. Identical for every outcome of the operation.
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NeutralResponse'
    ValidationError:
      description: Input failed server-side validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid session.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidCredentials:
      description: |
        Login failed. The same status, body shape, and code for every failure reason: unknown account, wrong
        password, unverified email, disabled account, and a throttled attempt (too many from this address, or a
        blocked account and address pair).
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The caller is an active member of the company but lacks the permission (D-108).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: |
        The caller has no ACTIVE membership in the company, or the company does not exist. One response
        for both, so it never reveals that a company exists (D-108).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: |
        The change is not possible in the current state (for example suspending a suspended member), or it would touch
        the Owner. Nothing was changed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CsrfRejected:
      description: Missing or invalid CSRF token, or a disallowed `Origin`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TokenInvalid:
      description: The token is unknown, expired, or already consumed (one response for all three).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: A rate limit was exceeded (an IP-level, per-account, per-inviter, per-company or per-recipient limit, depending on the operation).
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: |
        The rate-limit store is unavailable (fail closed, ADR-004), no password-hash capacity is
        available within the wait limit (D-85), or a company lock was not granted within 5 seconds (D-125). Retry.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
